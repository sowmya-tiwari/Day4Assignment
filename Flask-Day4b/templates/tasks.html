
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"
            defer></script>
</head>
<body>

    <div class="dashboard">
        <header class="topbar">
            <div>
                <h1>My Task Manager</h1>
                <p class="subtitle">Organize your day, one task at a time.</p>
            </div>
            <a class="logout-button" href="{{ url_for('logout') }}">
                Logout
            </a>
        </header>

        <section class="task-form-card">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <label for="title">Task Title</label>

                <div class="input-row">
                    <input type="text" id="title" name="title"
                           placeholder="What do you need to do?" required>

                    <button type="submit" id="addButton">Add Task</button>
                </div>
            </form>

            <p id="feedback" role="status" aria-live="polite"></p>
        </section>

        <section class="task-list-card">
            <h2>Your Tasks</h2>

            <p id="emptyMessage"
               {% if tasks %}hidden{% endif %}>
                No tasks yet. Add your first task above!
            </p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Task</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="taskList">
                        {% for task in tasks %}
                        <tr>
                            <td>{{ task["id"] }}</td>
                            <td>{{ task["title"] }}</td>
                            <td>
                                <span class="status">
                                    {{ task["status"] }}
                                </span>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    </div>

</body>
</html>
